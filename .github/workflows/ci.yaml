
name: Hello World CI Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  learn:
    name: lea
    runs-on: ubuntu-latest
    steps:
      - name: Build message
        run: echo "Build job completed successfully!"

  understand:
    name: Te
